<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="واجِز (Wajiz) — trusted Middle Eastern news, clustered and summarised into clear, balanced briefings. Sources always included.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wajiz">
  <meta name="theme-color" content="#08203A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Wajz · واجِز</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Tajawal:wght@700&display=swap" rel="stylesheet">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #08203A; }
    #wajz-boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(130% 120% at 75% 8%, #143A63 0%, #08203A 58%);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      transition: opacity .4s ease; opacity: 1;
    }
    #wajz-boot.hide { opacity: 0; pointer-events: none; }
    #wajz-boot .mark { width: 92px; height: 92px; animation: wajzIn .8s cubic-bezier(.2,.7,.3,1.2) both; }
    #wajz-boot .ar {
      margin-top: 22px; font-family: 'Tajawal', sans-serif; font-size: 46px; font-weight: 700;
      color: #EAF1F8; direction: rtl; animation: wajzIn .8s .1s ease both;
    }
    #wajz-boot .latin {
      margin-top: 2px; font-size: 16px; font-weight: 600; letter-spacing: 4px; color: #2DCCAE;
      animation: wajzIn .8s .2s ease both;
    }
    #wajz-boot .dot {
      margin-top: 30px; width: 7px; height: 7px; border-radius: 50%; background: #2DCCAE;
      animation: wajzPulse 1.1s infinite ease-in-out;
    }
    @keyframes wajzIn { from { opacity: 0; transform: translateY(8px) scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes wajzPulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
  </style>
</head>
<body>
  <div id="wajz-boot">
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="nv" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1A4778"/><stop offset="1" stop-color="#0B2845"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="96" height="96" rx="28" fill="url(#nv)"/>
      <rect x="2.5" y="2.5" width="95" height="95" rx="27.5" fill="none" stroke="#2DCCAE" stroke-opacity="0.25"/>
      <g stroke-linecap="round" stroke-width="9">
        <line x1="28" y1="34" x2="72" y2="34" stroke="#E7ECF2"/>
        <line x1="28" y1="50" x2="61" y2="50" stroke="#E7ECF2"/>
        <line x1="28" y1="66" x2="49" y2="66" stroke="#2DCCAE"/>
      </g>
    </svg>
    <div class="ar">واجِز</div>
    <div class="latin">Wajz</div>
    <div class="dot"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('wajz-boot');
      if (boot) { boot.classList.add('hide'); setTimeout(function () { boot.remove(); }, 450); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
